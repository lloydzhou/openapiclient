[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-httpx-client"
version = "0.5.0"
description = "A Python client for OpenAPI specifications using httpx"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "lloydzhou", email = "lloydzhou@qq.com" }]
requires-python = ">=3.7"
dependencies = [
    "httpx>=0.23.0",
    "pyyaml>=6.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/lloydzhou/openapiclient"
Repository = "https://github.com/lloydzhou/openapiclient"

[project.optional-dependencies]
cli = ["click>=8.1"]

[project.scripts]
oapi = "openapiclient.cli:main"

[tool.setuptools]
packages = ["openapiclient"]

[tool.pytest.ini_options]
testpaths = ["tests"]
